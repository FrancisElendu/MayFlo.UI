<div class="container">
  <div class="d-flex justify-content-between align-items-center mt-3">
    <h1 class="mb-0">Category List</h1>

    <a [routerLink]="['/admin', 'categories', 'add']"
       class="btn btn-primary">
       Add Category
    </a>
  </div>

  <div>
    @if (isLoading()) {
      <p>Loading...</p>
    } @else {
        @if (isError()) {
          <p class="text-danger">An error occurred while fetching categories.</p>
        } @else {

            <table class="table table-bordered mt-3">
              <thead>
                <tr>
                  <th>Id</th>
                  <th>Name</th>
                  <th>Url Handle</th>
                </tr>
              </thead>
              <tbody>
                @for (category of value(); track category.id) 
                {
                  <tr>
                    <td>{{ category.id }}</td>
                    <td>{{ category.name }}</td>
                    <td>{{ category.urlHandle }}</td>
                  </tr>
                }
              </tbody>
              
            </table>
            
        }
    }
  </div>
</div>
