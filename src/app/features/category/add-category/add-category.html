<div class="container">
    <h1 class="mt-3">Add Category</h1>

    <form [formGroup]="addCategoryFormGroup" (ngSubmit)="onSubmit()">
        <div class="mt-3">
          <div class="mt-3">
            <label class="form-label">Name</label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="name" 
              [class.is-invalid]="nameFormControl.invalid && nameFormControl.touched"
            />
            
            @if (nameFormControl.invalid && nameFormControl.touched) 
            {
              <div class="text-danger">
                {{ getErrorMessagesForName() }}
              </div>
            }
          </div> 
          <div class="mt-3">
            <label class="form-label">URL Handle (Slug)</label>
            <input 
              type="text" 
              class="form-control" 
              formControlName="urlHandle" 
              [class.is-invalid]="urlHandleFormControl.invalid && urlHandleFormControl.touched"
            />
            @if (nameFormControl.invalid && nameFormControl.touched) 
            {
              <div class="text-danger">
                {{ getErrorMessagesForUrlHandle() }}
              </div>
            }
          </div> 
          <div class="mt-3">
            <button [disabled]="!addCategoryFormGroup.valid" type="submit" class="btn btn-primary">Save</button>
          </div>
        </div>
    </form>
</div>
